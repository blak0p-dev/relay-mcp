name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (echo "Files not formatted with gofmt:"; gofmt -l .; exit 1)
      - name: Vet
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -shuffle=on -count=1 ./...
      - name: Test POSIX installer
        run: bash scripts/install_test.sh
      - name: Verify release contracts
        run: bash scripts/release_test.sh --release-config

  windows-installer:
    name: Test Windows installer runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test Windows installer runtime
        shell: pwsh
        run: ./scripts/install_test.ps1
