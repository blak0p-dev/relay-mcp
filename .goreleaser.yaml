version: 2
project_name: relay

builds:
  - id: relay
    main: ./cmd/relay-mcp
    binary: relay
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/blak0p/relay-mcp/internal/server/description.ServerVersion={{ .Version }}

archives:
  - id: relay
    ids:
      - relay
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "relay_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Version }}"
